[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[[redirects]]
  from = "/contact.php"
  to = "/.netlify/functions/contact"
  status = 200
  force = true

[[redirects]]
  from = "/api/funko-lookup"
  to = "/.netlify/functions/funko-lookup"
  status = 200
  force = true

[[redirects]]
  from = "/api/catalog-lookup"
  to = "/.netlify/functions/catalog-lookup"
  status = 200
  force = true


# RANSUMI: el kit de agosto en /clientes/fr-group/ quedo reemplazado (2026-11-18)
[[redirects]]
  from = "/clientes/fr-group/*"
  to = "/clientes/ransumi/brand-kit/"
  status = 301
  force = true
