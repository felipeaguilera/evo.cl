<svg viewBox="0 0 1200 500" xmlns="http://www.w3.org/2000/svg" font-family="Inter, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#E4572E"/>
    </marker>
    <marker id="arrowdark" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#696969"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="500" fill="#FFFFFF"/>
  <rect x="0" y="0" width="1200" height="6" fill="#E4572E"/>

  <!-- Header -->
  <g>
    <rect x="40" y="34" width="38" height="27" rx="1" fill="#E4572E"/>
    <text x="59" y="52" text-anchor="middle" font-size="11" font-weight="800" fill="#fff" letter-spacing="1.5">EVO</text>
    <text x="90" y="53" font-size="12" font-weight="700" fill="#0E0E0E" letter-spacing="1.2">EVO COMMUNICATION LAB</text>
    <text x="40" y="92" font-size="24" font-weight="800" fill="#0E0E0E" letter-spacing="0.5">ARQUITECTURA DE LA PLATAFORMA</text>
    <text x="41" y="116" font-size="12.5" font-weight="400" fill="#5A5A5A" font-family="'IBM Plex Mono', monospace" letter-spacing="0.6">EL MOTOR (COTIZACION A) Y LAS PLANTILLAS DE SALIDA (COTIZACION B) SON PIEZAS SEPARADAS.</text>
  </g>

  <!-- ZONA: Servidor CAI -->
  <rect x="40" y="150" width="980" height="270" rx="6" fill="#F5F3EE" stroke="#E5E2DC" stroke-width="1"/>
  <g font-family="'IBM Plex Mono', monospace">
    <rect x="40" y="150" width="980" height="4" fill="#111111"/>
    <text x="64" y="182" font-size="11" font-weight="500" fill="#696969" letter-spacing="2">ZONA SEGURA</text>
    <text x="64" y="202" font-size="15" font-weight="700" fill="#111111" font-family="Inter, Arial, sans-serif" letter-spacing="0.5">SERVIDOR DE CAI (WINDOWS) &#183; ACCESO VIA VPN</text>
  </g>
  <!-- lock badge -->
  <g transform="translate(986,176)">
    <rect x="0" y="6" width="24" height="18" rx="3" fill="#111111"/>
    <path d="M5,6 v-4 a7,7 0 0 1 14,0 v4" fill="none" stroke="#111111" stroke-width="3"/>
    <circle cx="12" cy="15" r="2.6" fill="#E4572E"/>
  </g>

  <!-- BOX 1: origen de datos -->
  <rect x="64" y="230" width="200" height="150" rx="4" fill="#FFFFFF" stroke="#E5E2DC"/>
  <text x="80" y="258" font-size="13.5" font-weight="700" fill="#0E0E0E">Softland ERP</text>
  <text x="80" y="277" font-size="13.5" font-weight="700" fill="#0E0E0E">+ SQL Server</text>
  <text x="80" y="303" font-size="10" fill="#5A5A5A" font-family="'IBM Plex Mono', monospace" letter-spacing="0.3">DATOS FINANCIEROS</text>
  <text x="80" y="317" font-size="10" fill="#5A5A5A" font-family="'IBM Plex Mono', monospace" letter-spacing="0.3">EN VIVO</text>

  <line x1="264" y1="305" x2="298" y2="305" stroke="#696969" stroke-width="1.5" marker-end="url(#arrowdark)"/>

  <!-- BOX 2: API de datos -->
  <rect x="300" y="230" width="200" height="150" rx="4" fill="#FFFFFF" stroke="#E4572E" stroke-width="1.5"/>
  <text x="316" y="262" font-size="14" font-weight="700" fill="#0E0E0E">API de datos</text>
  <text x="316" y="290" font-size="10" fill="#5A5A5A" font-family="'IBM Plex Mono', monospace" letter-spacing="0.3">CAMPOS DEFINIDOS</text>
  <text x="316" y="304" font-size="10" fill="#5A5A5A" font-family="'IBM Plex Mono', monospace" letter-spacing="0.3">SOLO LECTURA</text>

  <line x1="500" y1="305" x2="534" y2="305" stroke="#696969" stroke-width="1.5" marker-end="url(#arrowdark)"/>

  <!-- BADGE Cotizacion A -->
  <rect x="536" y="206" width="112" height="18" fill="#111111"/>
  <text x="592" y="219" text-anchor="middle" font-size="9" font-weight="700" fill="#FFFFFF" font-family="'IBM Plex Mono', monospace" letter-spacing="0.8">COTIZACION A</text>

  <!-- BOX 3: motor de reportes -->
  <rect x="536" y="230" width="200" height="150" rx="4" fill="#111111"/>
  <rect x="536" y="230" width="4" height="150" fill="#E4572E"/>
  <text x="556" y="262" font-size="14" font-weight="700" fill="#FFFFFF">Motor de</text>
  <text x="556" y="281" font-size="14" font-weight="700" fill="#FFFFFF">reportes</text>
  <text x="556" y="307" font-size="9.5" fill="#E4572E" font-family="'IBM Plex Mono', monospace" letter-spacing="0.3">CONTENEDOR DOCKER</text>
  <text x="556" y="320" font-size="9.5" fill="#E4572E" font-family="'IBM Plex Mono', monospace" letter-spacing="0.3">PORTATIL ENTRE SERVIDORES</text>
  <text x="556" y="345" font-size="9" fill="#AAAAAA" font-family="'IBM Plex Mono', monospace" letter-spacing="0.2">CONSULTA LA API AL</text>
  <text x="556" y="358" font-size="9" fill="#AAAAAA" font-family="'IBM Plex Mono', monospace" letter-spacing="0.2">CARGAR / FILTRAR</text>

  <line x1="736" y1="305" x2="770" y2="305" stroke="#696969" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#arrowdark)"/>

  <!-- BADGE Cotizacion B -->
  <rect x="772" y="206" width="112" height="18" fill="#E4572E"/>
  <text x="828" y="219" text-anchor="middle" font-size="9" font-weight="700" fill="#FFFFFF" font-family="'IBM Plex Mono', monospace" letter-spacing="0.8">COTIZACION B</text>

  <!-- BOX 4: plantillas / interfaz de salida -->
  <rect x="772" y="230" width="200" height="150" rx="4" fill="#FFFFFF" stroke="#E5E2DC"/>
  <text x="788" y="258" font-size="13.5" font-weight="700" fill="#0E0E0E">Plantillas de</text>
  <text x="788" y="277" font-size="13.5" font-weight="700" fill="#0E0E0E">reporteria (HTML)</text>
  <text x="788" y="303" font-size="9.5" fill="#5A5A5A" font-family="'IBM Plex Mono', monospace" letter-spacing="0.2">HOY: WEB LOCAL (VPN)</text>
  <text x="788" y="317" font-size="9.5" fill="#5A5A5A" font-family="'IBM Plex Mono', monospace" letter-spacing="0.2">FUTURO: APP, EMAIL,</text>
  <text x="788" y="331" font-size="9.5" fill="#5A5A5A" font-family="'IBM Plex Mono', monospace" letter-spacing="0.2">WEB REMOTA</text>

  <!-- boundary + arrow to cliente -->
  <line x1="1020" y1="150" x2="1020" y2="420" stroke="#E4572E" stroke-width="1.4" stroke-dasharray="5 5"/>
  <line x1="972" y1="305" x2="1038" y2="305" stroke="#E4572E" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="1005" y="290" text-anchor="middle" font-size="9" font-weight="700" fill="#C93D1A" font-family="'IBM Plex Mono', monospace" letter-spacing="0.5">VPN / REMOTO</text>
  <text x="1005" y="328" text-anchor="middle" font-size="9" font-weight="700" fill="#C93D1A" font-family="'IBM Plex Mono', monospace" letter-spacing="0.5">HOY</text>

  <!-- cliente -->
  <g transform="translate(1040,240)">
    <text x="72" y="4" text-anchor="middle" font-size="12" font-weight="700" fill="#0E0E0E" font-family="Inter, Arial, sans-serif">CLIENTE</text>
    <text x="72" y="22" text-anchor="middle" font-size="9.5" fill="#696969" font-family="'IBM Plex Mono', monospace" letter-spacing="1">LOGIN SEGURO</text>
    <!-- phone -->
    <rect x="36" y="40" width="34" height="60" rx="6" fill="#FFFFFF" stroke="#111111" stroke-width="2"/>
    <rect x="42" y="48" width="22" height="38" fill="#F5F3EE"/>
    <circle cx="53" cy="93" r="2.5" fill="#111111"/>
    <!-- laptop -->
    <rect x="80" y="52" width="58" height="38" rx="3" fill="#FFFFFF" stroke="#111111" stroke-width="2"/>
    <rect x="86" y="58" width="46" height="26" fill="#F5F3EE"/>
    <rect x="74" y="90" width="70" height="6" rx="2" fill="#111111"/>
  </g>

  <!-- nota desacople -->
  <text x="754" y="404" text-anchor="middle" font-size="9.5" font-weight="700" fill="#C93D1A" font-family="'IBM Plex Mono', monospace" letter-spacing="0.3">LAS PLANTILLAS SE DESARROLLAN EN PARALELO, SIN ESPERAR AL MOTOR</text>

  <!-- nota replicabilidad -->
  <rect x="64" y="440" width="950" height="30" rx="3" fill="#111111"/>
  <text x="539" y="459" text-anchor="middle" font-size="10" font-weight="500" fill="#FFFFFF" font-family="'IBM Plex Mono', monospace" letter-spacing="0.4">MISMO MOTOR, REPLICABLE A OTROS CLIENTES DE CAI: CADA UNO CON SU PROPIA API Y SUS PROPIAS PLANTILLAS</text>
</svg>
